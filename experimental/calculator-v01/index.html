<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMKB Calculatrice scientifique V0</title>
  <style>
    * {box-sizing:border-box}
    [hidden] {display:none!important}
    :root {color-scheme:light;--touch-target:2.75rem;--gap:4px}
    body {margin:0;background:#ddd;color:#111;font:16px/1.45 system-ui,sans-serif}
    main {max-width:650px;margin:auto;min-height:100dvh;padding:8px;background:#fafafa}
    h1 {font-size:1.1rem;margin:0}
    header {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
    a {color:#111;min-height:var(--touch-target);display:inline-flex;align-items:center}
    button {color:#111;background:#fff;border:2px solid #111;min-height:var(--touch-target);
      padding:6px 3px;font:inherit;cursor:pointer;border-radius:2px}
    button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible {
      outline:2px solid #444;outline-offset:2px}
    button:active {background:#ddd}
    .display {border:2px solid #111;background:#fff;padding:12px;margin-bottom:10px}
    .display label {display:block;font-size:.8rem;font-weight:700;margin-bottom:4px}
    #calc-expression {display:block;width:100%;border:0;background:transparent;
      color:#111;font:1.2rem ui-monospace,monospace;min-height:var(--touch-target);
      padding:4px;outline-offset:0}
    #calc-result {display:block;text-align:right;font:1.8rem ui-monospace,monospace;
      overflow-wrap:anywhere;min-height:2.5rem}
    .controls {display:flex;justify-content:space-between;gap:8px;margin:10px 0}
    .controls button {min-width:var(--touch-target)}
    #calc-keys {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
    #calc-keys button {min-width:0;font-size:.9rem}
    #calc-error {font-size:.875rem;font-weight:700;overflow-wrap:anywhere}
    details {margin-top:12px}
    summary {min-height:var(--touch-target);cursor:pointer}
    .hint {font-size:.8rem;color:#444}
    @media(max-width:370px) {main {padding:4px}#calc-keys {gap:3px}#calc-keys button {padding:5px 0}}
  </style>
  <script src="../shared/virtual_keyboard.js"></script>
  <script src="calculator-core.js"></script>
  <script src="calculator-app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a href="../notes-v01/index.html" title="Retour à PMKB Notes">← Notes</a>
      <h1>Calculatrice scientifique</h1>
      <button id="calc-angle" type="button" aria-label="Basculer degrés/radians"
        title="Mode d'angle">DEG</button>
    </header>
    <div class="display">
      <label for="calc-expression">Expression</label>
      <input id="calc-expression" type="text" maxlength="192"
        autocomplete="off" autocapitalize="off" spellcheck="false">
      <output id="calc-result" aria-live="polite">0</output>
    </div>
    <div class="controls">
      <button id="calc-clear" type="button" title="Effacer l'expression">C</button>
      <button id="calc-all-clear" type="button" title="Tout effacer, y compris Ans">AC</button>
    </div>
    <div id="calc-keys" aria-label="Pavé scientifique"></div>
    <p id="calc-error" role="alert" hidden></p>
    <details>
      <summary>Historique de cette session</summary>
      <ol id="calc-history"></ol>
    </details>
    <p class="hint">Hors ligne · aucune donnée envoyée ni enregistrée · calculs en double précision.
      Multiplication explicite : 2×π, pas 2π. Les pourcentages sont divisés par 100.</p>
  </main>
</body>
</html>
