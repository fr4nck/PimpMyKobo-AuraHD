name: Tests

on:
  push:
    branches: [main, fix/claude-audit, feat/rebuild-rootfs-spec, feat/audit-arm-runtime]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Linux rebuild backend (fakeroot; e2fsprogs is preinstalled)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot e2fsprogs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Qt runtime
        run: python -m pip install PySide6-Essentials==6.10.2
      - name: Run local GUI tests
        run: python -m unittest discover -s tests -p test_gui.py -v


  qualification-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Debian Live build backend
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring xorriso squashfs-tools curl
          curl -fsSLo "$RUNNER_TEMP/live-build.deb" \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
          echo "a863905724e7b69d45066ebab113cb6de12a11984349847ad49f6151c10f017d  $RUNNER_TEMP/live-build.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/live-build.deb"
          lb --version
      - name: Create synthetic qualification bundle
        run: |
          python tests/make_qualification_live_fixture.py "$RUNNER_TEMP/pmkb-live-fixture"
      - name: Build real bootable qualification ISO
        run: |
          mkdir -p "$RUNNER_TEMP/pmkb-live-out"
          sudo tools/build-qualification-live.sh \
            "$RUNNER_TEMP/pmkb-live-fixture/fixture.img" \
            "$RUNNER_TEMP/pmkb-live-fixture/plan.json" \
            "$RUNNER_TEMP/pmkb-live-out" \
            "$RUNNER_TEMP/pmkb-live-fixture/candidate.json"
      - name: Verify ISO and embedded PMKB payload
        run: |
          ISO="$RUNNER_TEMP/pmkb-live-out/PMKB-Qualification-USB-cafebabe.iso"
          test -s "$ISO"
          sha256sum -c "$ISO.sha256"
          xorriso -osirrox on -indev "$ISO" \
            -extract /live/filesystem.squashfs "$RUNNER_TEMP/filesystem.squashfs"
          unsquashfs -ll "$RUNNER_TEMP/filesystem.squashfs" > "$RUNNER_TEMP/squashfs.list"
          grep -F "usr/local/sbin/pmkb-qualification" "$RUNNER_TEMP/squashfs.list"
          grep -F "opt/pmkb/tools/restore-p1-linux.py" "$RUNNER_TEMP/squashfs.list"
          grep -F "opt/pmkb/tools/replace-microsd-linux.py" "$RUNNER_TEMP/squashfs.list"
          grep -F "opt/pmkb/restore-plan.json" "$RUNNER_TEMP/squashfs.list"
          grep -F "opt/pmkb/BUILD-IDENTITY.json" "$RUNNER_TEMP/squashfs.list"
          grep -F "opt/pmkb/fixture.img" "$RUNNER_TEMP/squashfs.list"
          grep -F "etc/systemd/system/pmkb-qualification.service" "$RUNNER_TEMP/squashfs.list"
          grep -F "bin/loadkeys" "$RUNNER_TEMP/squashfs.list"
          grep -F "usr/share/keymaps/" "$RUNNER_TEMP/squashfs.list"
          grep -F "sbin/mkfs.fat" "$RUNNER_TEMP/squashfs.list"
          # Import the backend from the actual ISO payload, without repository fallbacks.
          unsquashfs -no-progress -d "$RUNNER_TEMP/pmkb-live-extracted" \
            "$RUNNER_TEMP/filesystem.squashfs" usr/local/sbin/pmkb-qualification opt/pmkb
          python -I -B - "$RUNNER_TEMP/pmkb-live-extracted" <<'PY'
          import importlib.machinery, importlib.util, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          ui = root / "usr/local/sbin/pmkb-qualification"
          loader = importlib.machinery.SourceFileLoader("iso_qualification_ui", str(ui))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          backend = module.load_backend(root / "opt/pmkb/tools/restore-p1-linux.py")
          backend.legacy.load_inspector()
          replacement = module.load_replacement_backend(
              root / "opt/pmkb/tools/replace-microsd-linux.py")
          assert replacement.MIN_P3_BYTES >= 1024 * 1024 * 1024
          identity = json.loads((root / "opt/pmkb/BUILD-IDENTITY.json").read_text())
          plan, sha = backend.validate_sealed_plan(
              root / "opt/pmkb/restore-plan.json",
              root / "opt/pmkb" / identity["image_name"], identity["plan_sha256"])
          assert sha == identity["plan_sha256"]
          assert plan["write_authorized"] is False
          assert plan["physical_restore_eligible"] is False
          PY
