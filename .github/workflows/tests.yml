name: Tests

on:
  push:
    branches: [main, fix/claude-audit, feat/rebuild-rootfs-spec, feat/pmkb-notes-v02-typography-drawer]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Linux rebuild backend (fakeroot; e2fsprogs is preinstalled)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot e2fsprogs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Lua launcher tests (one Linux matrix job)
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        run: |
          sudo apt-get install -y lua5.1
          lua tests/test_launcher_v0.lua
          lua tests/test_launcher_statusbar.lua
          lua experimental/launcher-v0/status-preview.lua > /tmp/pmkb-v03-status-preview.svg
      - name: Check illustrated launcher simulator model (one Linux matrix job)
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        run: |
          node --check experimental/notes-v01/notes-core.js
          node --check experimental/notes-v01/notes-app.js
          node --test tests/test_launcher_simulator.cjs tests/test_notes_core.cjs
  notes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Notes syntax and regression tests
        run: |
          node --check experimental/notes-v01/notes-core.js
          node --check experimental/notes-v01/notes-app.js
          node --check experimental/shared/virtual_keyboard.js
          node --check experimental/calculator-v01/calculator-core.js
          node --check experimental/calculator-v01/calculator-app.js
          node --test tests/test_notes_core.cjs tests/test_notes_app.cjs tests/test_virtual_keyboard.cjs tests/test_calculator_core.cjs tests/test_calculator_app.cjs
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Qt runtime
        run: python -m pip install PySide6-Essentials==6.10.2
      - name: Run local GUI tests
        run: python -m unittest discover -s tests -p test_gui.py -v
