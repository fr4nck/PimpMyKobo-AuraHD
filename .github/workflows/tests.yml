name: Tests

on:
  push:
    branches: [main, fix/claude-audit, feat/rebuild-rootfs-spec, feat/audit-arm-runtime]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Linux rebuild backend (fakeroot; e2fsprogs is preinstalled)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot e2fsprogs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Qt runtime
        run: python -m pip install PySide6-Essentials==6.10.2
      - name: Run local GUI tests
        run: python -m unittest discover -s tests -p test_gui.py -v
